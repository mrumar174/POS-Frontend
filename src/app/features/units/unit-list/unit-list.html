<div class="container">
  <app-page-header [segments]="['Catalog', 'Units']"></app-page-header>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Units</h4>
    <a routerLink="/units/new" class="btn btn-primary btn-sm">+ New Unit</a>
  </div>

  @if (loading()) {
    <p class="text-muted">Loading...</p>
  } @else if (units().length === 0) {
    <p class="text-muted">No units yet.</p>
  } @else {
    <table class="table table-hover align-middle">
      <thead>
        <tr><th style="width: 60px;">Sr.</th><th>Name</th><th>Short Name</th><th style="width: 160px;"></th></tr>
      </thead>
      <tbody>
        @for (unit of units(); track unit.id) {
          <tr>
            <td>{{ $index+1 }}</td>
            <td>{{ unit.name }}</td>
            <td>{{ unit.shortName }}</td>
            <td class="text-end">
              <a [routerLink]="['/units', unit.id, 'edit']" class="btn btn-outline-secondary btn-sm me-1">Edit</a>
              <button class="btn btn-outline-danger btn-sm" (click)="remove(unit)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
