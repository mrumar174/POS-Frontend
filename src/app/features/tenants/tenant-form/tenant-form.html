<div class="container">
  <app-page-header [segments]="['Tenancy','Edit Tenant']"></app-page-header>

  <div class="row">
    <div class="col-3"></div>
    <div class="col-8">
      <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row g-2">
      <div class="col-md-6 mb-2">
        <label class="form-label">Business Name</label>
        <input type="text" class="form-control" formControlName="businessName" />
      </div>
      <div class="col-md-6 mb-2">
        <label class="form-label">Owner Name</label>
        <input type="text" class="form-control" formControlName="ownerName" />
      </div>
      <div class="col-md-6 mb-2">
        <label class="form-label">Contact No</label>
        <input type="text" class="form-control" formControlName="contactNo" />
      </div>
      <div class="col-md-6 mb-2">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" />
      </div>
      <div class="col-md-6 mb-2">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" formControlName="address" />
      </div>
      <div class="col-md-6 mb-2">
        <label class="form-label">City</label>
        <input type="text" class="form-control" formControlName="city" />
      </div>
      <div class="col-md-6 mb-2">
        <label class="form-label">Max Shops</label>
        <input type="number" class="form-control" formControlName="maxShops" min="1" />
      </div>
      <div class="col-md-6 mb-2">
        <label class="form-label">Max Users</label>
        <input type="number" class="form-control" formControlName="maxUsers" min="1" />
      </div>
    </div>

    <div class="d-flex gap-2 mt-2">
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) { Saving... } @else { Save }
      </button>
      <a routerLink="/tenants" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
    </div>
    <div class="col"></div>
  </div>
</div>
