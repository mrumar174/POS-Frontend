<div class="container">
  <app-page-header [segments]="['Identity & Access', 'Permissions List']"></app-page-header>
  <div class="d-flex justify-content-end align-items-center mb-3">
    <a routerLink="/permissions/new" class="btn btn-primary btn-sm">+ Add Permissions</a>
  </div>

  @if (loading()) {
    <p class="text-muted">Loading...</p>
  } @else if (permissions().length === 0) {
    <p class="text-muted">No permissions seeded yet.</p>
  } @else {
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th style="width: 60px;">Sr</th>
          <th>Module</th>
          <th>Name</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        @for (p of permissions(); track p.id) {
          <tr>
            <td>{{ $index+1 }}</td>
            <td><span class="badge bg-secondary">{{ p.module }}</span></td>
            <td>{{ p.name }}</td>
            <td class="text-muted">{{ p.description || '—' }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
