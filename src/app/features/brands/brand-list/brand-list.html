<div class="container">
  <app-page-header [segments]="['Catalog', 'Brands']"></app-page-header>

  <div class="d-flex justify-content-end align-items-center mb-3">
    <a routerLink="/brands/new" class="btn btn-primary btn-sm">+ New Brand</a>
  </div>

  @if (loading()) {
    <p class="text-muted">Loading...</p>
  } @else if (brands().length === 0) {
    <p class="text-muted">No brands yet.</p>
  } @else {
    <table class="table table-hover align-middle">
      <thead>
        <tr><th style="width: 60px;">Sr.</th><th>Name</th><th>Description</th><th style="width: 160px;"></th></tr>
      </thead>
      <tbody>
        @for (brand of brands(); track brand.id) {
          <tr>
            <td>{{ $index+1 }}</td>
            <td>{{ brand.name }}</td>
            <td class="text-muted">{{ brand.description || '—' }}</td>
            <td class="text-end">
              <a [routerLink]="['/brands', brand.id, 'edit']" class="btn btn-outline-secondary btn-sm me-1">Edit</a>
              <button class="btn btn-outline-danger btn-sm" (click)="remove(brand)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
