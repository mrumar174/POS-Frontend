<div class="container" style="max-width: 560px; margin-top: 3rem; margin-bottom: 3rem;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="card-title mb-3">Sign up your business</h4>
      <p class="text-muted small">This creates your Tenant, a main Shop, and your admin login in one step.</p>
      @if (errorMessage()) {
        <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <h6 class="mt-3 mb-2 text-secondary">Business details</h6>
        <div class="row g-2">
          <div class="col-md-6 mb-2">
            <label class="form-label">Business Name</label>
            <input type="text" class="form-control" formControlName="businessName" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Owner Name</label>
            <input type="text" class="form-control" formControlName="ownerName" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Contact No</label>
            <input type="text" class="form-control" formControlName="contactNo" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Email <span class="text-muted">(optional)</span></label>
            <input type="email" class="form-control" formControlName="email" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Address <span class="text-muted">(optional)</span></label>
            <input type="text" class="form-control" formControlName="address" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">City <span class="text-muted">(optional)</span></label>
            <input type="text" class="form-control" formControlName="city" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Main Shop Name</label>
            <input type="text" class="form-control" formControlName="mainShopName" />
          </div>
        </div>
        <h6 class="mt-3 mb-2 text-secondary">Admin login</h6>
        <div class="row g-2">
          <div class="col-md-6 mb-2">
            <label class="form-label">Admin Username</label>
            <input type="text" class="form-control" formControlName="adminUserName" autocomplete="username" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Admin Full Name</label>
            <input type="text" class="form-control" formControlName="adminFullName" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Admin Password</label>
            <input type="password" class="form-control" formControlName="adminPassword" autocomplete="new-password" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loading()">
          @if (loading()) { Creating your account... } @else { Create business account }
        </button>
      </form>
      <p class="text-center mt-3 mb-0">
        Already have an account? <a routerLink="/login">Log in</a>
      </p>
    </div>
  </div>
</div>
