<div class="container" style="max-width: 420px; margin-top: 4rem;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="card-title mb-3">Log in</h4>
      @if (errorMessage()) {
        <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Tenant ID</label>
          <input type="number" class="form-control" formControlName="tenantId" min="1" />
        </div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" formControlName="userName" autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" autocomplete="current-password" />
        </div>
        <div class="mb-3">
          <label class="form-label">Shop ID <span class="text-muted">(optional)</span></label>
          <input type="number" class="form-control" formControlName="shopId" min="1" />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) { Logging in... } @else { Log in }
        </button>
      </form>
      <p class="text-center mt-3 mb-0">
        No account yet? <a routerLink="/signup">Sign up your business</a>
      </p>
    </div>
  </div>
</div>
