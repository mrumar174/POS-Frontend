<div class="container">
  <app-page-header [segments]="['Tenancy', isEditMode() ? 'Edit Shop' : 'Create Shop']"></app-page-header>
  <div class="row">
    <div class="col-4"></div>
    <div class="col-7">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" formControlName="name" />
        </div>
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" formControlName="address" />
        </div>
        <div class="mb-3">
          <label class="form-label">City</label>
          <input type="text" class="form-control" formControlName="city" />
        </div>
        <div class="mb-3">
          <label class="form-label">Contact No</label>
          <input type="text" class="form-control" formControlName="contactNo" />
        </div>
        <div class="mb-3">
          <label class="form-label">Invoice Prefix</label>
          <input type="text" class="form-control" formControlName="invoicePrefix" />
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="loading()">
            @if (loading()) { Saving... } @else { Save }
          </button>
          <a routerLink="/shops" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
    <div class="col"></div>
  </div>
</div>
