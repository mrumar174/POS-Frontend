<div class="container">
  <app-page-header [segments]="['Identity & Assess', isEditMode() ? 'Edit Role' : 'Create Role' ]"></app-page-header>
  <div class="row">
    <div class="col-4"></div>
    <div class="col-7">
      <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" formControlName="name" />
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <input type="text" class="form-control" formControlName="description" />
    </div>

    <label class="form-label">Permissions</label>
    <div class="border rounded p-2 mb-3" style="max-height: 300px; overflow-y: auto;">
      @for (p of allPermissions(); track p.id) {
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            [id]="'perm-' + p.id"
            [checked]="isChecked(p.id!)"
            (change)="togglePermission(p.id!, $any($event.target).checked)"
          />
          <label class="form-check-label" [for]="'perm-' + p.id">
            <span class="badge bg-secondary me-1">{{ p.module }}</span>{{ p.name }}
          </label>
        </div>
      }
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) { Saving... } @else { Save }
      </button>
      <a routerLink="/roles" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
    </div>
  </div>
  <div class="col"></div>
</div>
